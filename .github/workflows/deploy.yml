name: Build Node.js Website to Docker Hub

on:
  push:
    branches:
      - replit-agent  # Action jalan saat kamu push ke branch main

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and Push
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          # Ganti 'nama-web-aku' dengan nama repo di Docker Hub kamu
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/nama-web-node:latest
